<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS de Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS general del proyecto (variables de color, navbar, logo) -->
    <link rel="stylesheet" href="../style.css">
    <!-- CSS propio del login -->
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <title>UNM Talleres | Ingresar</title>
</head>

<body class="pagina-login">

    <!-- Barra superior (solo logo) -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container px-4">
            <a class="navbar-brand" href="inicio.html">
                <img src="../img/logo-01.webp" alt="Logo UNM" class="logo">
            </a>
        </div>
    </nav>

    <!-- Fondo + tarjeta de login -->
    <main class="login-fondo">
        <section class="login-card" aria-labelledby="titulo-login">
            <h1 id="titulo-login" class="visually-hidden">Ingresar a UNM Talleres</h1>

            <form id="formLogin" novalidate>
                <div class="campo">
                    <label for="dni" class="campo-label">DNI</label>
                    <input type="text" id="dni" class="campo-input" inputmode="numeric" maxlength="8"
                        autocomplete="username" aria-describedby="errorDni">
                    <div id="errorDni" class="campo-error" role="alert"></div>
                </div>

                <div class="campo">
                    <label for="password" class="campo-label">CONTRASEÑA</label>
                    <div class="campo-password">
                        <input type="password" id="password" class="campo-input" autocomplete="current-password"
                            aria-describedby="errorPassword">
                        <button type="button" id="verPassword" class="btn-ojo" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="errorPassword" class="campo-error" role="alert"></div>
                </div>

                <div id="errorGeneral" class="campo-error text-center" role="alert"></div>

                <div class="text-center">
                    <a href="../index.html" class="btn-ingresar" id="btnIngresar">INGRESAR</a>
                </div>

                <div class="text-center mt-3">
                    <a href="#" class="link-recuperar" data-bs-toggle="modal" data-bs-target="#modalRecuperar">
                        Recuperar tu contraseña
                    </a>
                </div>
            </form>
        </section>
    </main>

    <!-- Modal: recuperar contraseña (simulado) -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-labelledby="tituloRecuperar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-recuperar">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title fs-5 fw-semibold" id="tituloRecuperar">Recuperar contraseña</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <!-- Paso 1: pedir DNI -->
                    <form id="formRecuperar" novalidate>
                        <p class="texto-ayuda">Ingresá tu DNI y te enviaremos un enlace para crear una nueva contraseña.
                        </p>
                        <label for="dniRecuperar" class="campo-label">DNI</label>
                        <input type="text" id="dniRecuperar" class="campo-input" inputmode="numeric" maxlength="8">
                        <div id="errorRecuperar" class="campo-error" role="alert"></div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn-ingresar btn-ingresar-sm">ENVIAR ENLACE</button>
                        </div>
                    </form>

                    <!-- Paso 2: confirmación -->
                    <div id="recuperarOk" class="text-center d-none">
                        <i class="bi bi-envelope-check icono-ok"></i>
                        <p class="mt-3 mb-1 fw-semibold">¡Listo! Revisá tu correo.</p>
                        <p class="texto-ayuda mb-4">Si el DNI <strong id="dniEnviado"></strong> está registrado, vas a
                            recibir un enlace para restablecer tu contraseña.</p>
                        <button type="button" class="btn-ingresar btn-ingresar-sm"
                            data-bs-dismiss="modal">VOLVER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="inicio.js"></script>
</body>

</html>
